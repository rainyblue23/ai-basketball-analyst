<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>补充一个球场机位</title><style>
body{font:16px system-ui;background:#111827;color:#eee;max-width:1200px;margin:auto;padding:20px}button,select{font:inherit;padding:9px;margin:5px}canvas{width:100%;touch-action:none;border:1px solid #64748b}p{line-height:1.6}a{color:#93c5fd}.row{display:flex;gap:20px;flex-wrap:wrap}.row img{max-width:360px;max-height:210px}#status{color:#86efac}svg{background:#293548;max-width:300px;height:240px}label{display:block;margin:12px 0}
</style><a href="./">← 返回恢复对照</a><h2>补充正面机位：只需这一张</h2>
<p>当前两张参照是侧视画面，这张是正面罚球机位。点地面线交点，至少4点；看不清可跳过，不点篮筐或人脚。</p>
<p id="identity"></p><div class="row"><svg viewBox="0 0 300 240" aria-label="地面点示意图"><path d="M20 55H280 M85 55V170H215V55 M85 170A65 45 0 0 0 215 170" fill="none" stroke="white" stroke-width="2"/><text x="95" y="30" fill="white">篮筐所在底线</text><g fill="#86efac" font-size="15"><text x="65" y="50">1</text><text x="220" y="50">2</text><text x="65" y="180">3</text><text x="220" y="180">4</text><text x="145" y="166">5</text></g><g fill="#86efac"><circle cx="85" cy="55" r="4"/><circle cx="215" cy="55" r="4"/><circle cx="85" cy="170" r="4"/><circle cx="215" cy="170" r="4"/><circle cx="150" cy="170" r="4"/></g></svg>
<div><label>对应原参照<select id="side"><option value="UNKNOWN">不确定</option><option value="A">A端（第一张侧视参照）</option><option value="B">B端（第二张侧视参照）</option></select></label><label>选择点名<select id="landmark"></select></label><button id="undo">撤销一点</button><button id="clear">清空本张</button><button id="export">保存标注JSON</button><p id="status"></p><p>保存后发给我即可，不需要记时间；不确定的对应端可以保留“不确定”。<br>标注只保存在本机，不自动修改正式标定。</p></div></div>
<canvas id="canvas" aria-label="在原图标记地面交点"></canvas><details><summary>查看原来的两张参照</summary><div class="row"><figure><img src="reference_A.jpg"><figcaption>A端</figcaption></figure><figure><img src="reference_B.jpg"><figcaption>B端</figcaption></figure></div></details>
<script>
const $=id=>document.getElementById(id),names=[['paint_base_left','1. 底线与禁区交点（示意图左）'],['paint_base_right','2. 底线与禁区交点（示意图右）'],['lane_left','3. 罚球线与禁区交点（示意图左）'],['lane_right','4. 罚球线与禁区交点（示意图右）'],['ft','5. 罚球线中点']];
let task,points={},image=new Image(),key;const canvas=$('canvas'),ctx=canvas.getContext('2d');
function save(){localStorage.setItem(key,JSON.stringify({points,side:$('side').value}));draw()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0);names.forEach(([name,label],i)=>{if(!points[name])return;const [x,y]=points[name].map((v,j)=>v*(j?canvas.height:canvas.width));ctx.strokeStyle='#00ff99';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.stroke();ctx.font='bold 26px system-ui';ctx.fillStyle='#00ff99';ctx.fillText(String(i+1),x+12,y-12)});$('status').textContent='已标 '+Object.keys(points).length+' 点；看不清的不用标。'}
canvas.onclick=e=>{const rect=canvas.getBoundingClientRect();points[$('landmark').value]=[(e.clientX-rect.left)/rect.width,(e.clientY-rect.top)/rect.height];const next=names.find(([n])=>!points[n]);if(next)$('landmark').value=next[0];save()};
$('undo').onclick=()=>{const keys=Object.keys(points);if(keys.length)delete points[keys.at(-1)];save()};$('clear').onclick=()=>{points={};save()};$('side').onchange=save;
$('export').onclick=()=>{if(Object.keys(points).length<4){$('status').textContent='请至少标4个地面交点；看不清可先保存在本机。';return}const data={...task,reference_side:$('side').value,normalized_points:points,point_names_semantics:'Names refer to schematic left/right; orientation and ground geometry require review before application.',review_status:'annotated_pending_geometry_validation',training_approved:false,inference_reads_this_file:false};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=task.task_id+'.json';a.click();URL.revokeObjectURL(a.href)};
(async()=>{task=await(await fetch('registration_task.json',{cache:'no-store'})).json();key='extra-court:'+task.video_sha256+':'+task.source_frame;const cached=JSON.parse(localStorage.getItem(key)||'null');points=cached?.points||{};$('side').value=cached?.side||'UNKNOWN';names.forEach(([n,label])=>{const option=document.createElement('option');option.value=n;option.textContent=label;$('landmark').append(option)});$('identity').textContent='原片 '+task.source_timestamp_nominal_s.toFixed(3)+' 秒 · F'+task.source_frame+' · SHA '+task.video_sha256.slice(0,12);image.onload=()=>{canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;draw()};image.src=task.image;})().catch(e=>{$('status').textContent='加载失败：'+e.message});
</script></html>
