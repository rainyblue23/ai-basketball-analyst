<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比赛标注 · 哨响之后</title>
<style>
:root{color-scheme:dark;--bg:#0b1017;--surface:#131a24;--ink:#eaf0f7;--muted:#a9bbd0;--line:#354457;--accent:#ff7a33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif}header{padding:20px 4vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}h2{font-size:20px;margin:0 0 10px}p{margin:6px 0 16px;color:var(--muted)}main{max-width:1500px;margin:auto;padding:24px 4vw}button,select,input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px}button{cursor:pointer;min-height:42px}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:#201109;border-color:var(--accent);font-weight:700}:focus-visible{outline:3px solid #86b5ff;outline-offset:3px}::selection{background:#ff7a33;color:#201109}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.tabs{border-bottom:1px solid var(--line);padding-bottom:12px}.active{border-color:var(--accent);color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:28px}video{width:100%;background:#000;max-height:62vh}.panel{background:var(--surface);padding:20px;border-radius:8px}label{display:inline-flex;align-items:center;gap:8px}input[type=number]{width:100px}input[type=text]{width:100%}.time{font-variant-numeric:tabular-nums;font-size:20px}.entry{display:grid;gap:12px}.entry label{justify-content:space-between}.table-wrap{overflow:auto;max-height:310px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:400}.small{font-size:13px;color:var(--muted)}#status{color:#a9bbd0;min-width:100px}#status.error{color:#ffa0a5}#stage{position:relative;line-height:0;touch-action:none;background:#000}#frameImage{width:100%;display:block}#boxes{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}section[hidden]{display:none!important}.done{margin-top:18px;display:flex;gap:10px;align-items:flex-start}footer{margin-top:24px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}main{padding:20px}video{max-height:50vh}}
</style>
<header><h1>比赛标注</h1><div class="bar" style="margin:0"><span id="status" role="status">正在载入</span><button id="save" class="primary">保存到项目</button></div></header>
<main><div class="bar"><label>选择比赛 <select id="match"></select></label><span id="range" class="small"></span></div>
<div class="bar tabs"><button id="shotTab" class="active">出手记录</button><button id="ballTab">篮球核对帧</button></div>
<section id="shotSection"><div class="layout"><div><video id="video" controls preload="metadata"></video><div class="bar"><button id="back">退1秒</button><button id="play">播放 / 暂停</button><button id="forward">进1秒</button><span id="clock" class="time">00:30.00</span><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">0.5倍</option><option value="0.25">0.25倍</option></select></div><p>只标原片 00:30–01:30。看所有球员；以球离手时刻为准，看不清就选未知。</p><label class="done"><input id="shotsComplete" type="checkbox">这60秒已完整看过，所有出手都已记录（没有出手也勾选）</label></div>
<div class="panel"><h2 id="entryTitle">记录一次出手</h2><div class="entry"><label>离手时间（原片秒数）<input id="release" type="number" min="30" max="89.999" step="0.01" value="30"></label><button id="capture">取当前视频时间</button><label>结果<select id="result"><option value="made">进</option><option value="missed">不进</option><option value="unknown">看不清</option></select></label><label>分值<select id="value"><option value="">不确定</option><option value="1">1分 · 罚球</option><option value="2">2分</option><option value="3">3分</option></select></label><label><input id="replay" type="checkbox">同一次出手的重复回放</label><input id="note" type="text" placeholder="备注（可留空）" aria-label="出手备注"><div class="bar"><button id="add" class="primary">添加出手</button><button id="cancel" hidden>取消编辑</button></div></div><h2>已记录 <span id="shotCount">0</span> 次</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>结果 / 分值</th><th>操作</th></tr></thead><tbody id="shotRows"></tbody></table><p id="empty">还没有记录。看到出手后暂停，取当前时间再添加。</p></div></div></div></section>
<section id="ballSection" hidden><div class="layout"><div><div id="stage"><img id="frameImage" alt="待核对的比赛原始帧"><svg id="boxes" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-label="拖动框选篮球"></svg></div><div class="bar" style="margin-top:12px"><button id="prevFrame">上一帧</button><span id="frameCount"></span><button id="nextFrame">下一帧</button><button id="seeFrame">在视频看这一刻</button></div></div><div class="panel"><h2>这帧能看到篮球吗？</h2><p>可见：拖框包住篮球。不能确定位置就选看不清，不要猜。</p><div class="bar"><button data-vis="visible">球可见</button><button data-vis="not_visible">看不到球</button><button data-vis="unclear">看不清</button></div><label>框选对象<select id="boxKind"><option value="ball">篮球 · 绿框</option><option value="decoy">队标 / 干扰物 · 橙框</option></select></label><div class="bar" style="margin-top:16px"><button id="undo">撤销最后一个框</button><button id="clear">清空这一帧</button></div><p id="frameState"></p><p class="small">框选后会记住原图位置。队标框可选，先把篮球标清楚。</p><label class="done"><input id="framesComplete" type="checkbox">这组8帧全部核对完成</label></div></div></section>
<footer>先完成一场也可以；保存后关页不丢失。出手记录和篮球框可以分两次做。</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let items=[],item=null,data=null,frameIndex=0,editIndex=null,dirty=false,saving=false,start=null,draft=null;
const key=()=>`aihoop-match-labels-v1:${item.id}`;
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function changed(){dirty=true;localStorage.setItem(key(),JSON.stringify(data));status('未保存到项目')}
const mm=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`;
async function request(url,options){const response=await fetch(url,options);const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result}
function frame(){const image=item.images[frameIndex];let row=data.frames.find(f=>f.image===image);if(!row){row={image,visibility:'pending',boxes:[]};data.frames.push(row)}return row}
function renderShots(){const rows=$('shotRows');rows.replaceChildren();$('shotCount').textContent=data.shots.length;$('empty').hidden=!!data.shots.length;
 data.shots.forEach((s,i)=>{const tr=document.createElement('tr');const time=document.createElement('td');const seek=document.createElement('button');seek.textContent=mm(s.release_s);seek.onclick=()=>{$('video').currentTime=Math.max(item.start_s,s.release_s-1)};time.append(seek);const info=document.createElement('td');info.textContent=({made:'进',missed:'不进',unknown:'看不清'}[s.result])+' / '+(s.value?`${s.value}分`:'分值未知')+(s.is_replay?' · 回放':'');const ops=document.createElement('td');const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>{editIndex=i;$('release').value=s.release_s;$('result').value=s.result;$('value').value=s.value||'';$('replay').checked=!!s.is_replay;$('note').value=s.note||'';$('entryTitle').textContent='修改这次出手';$('add').textContent='保存修改';$('cancel').hidden=false};const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{data.shots.splice(i,1);cancel();changed();renderShots()};ops.append(edit,del);tr.append(time,info,ops);rows.append(tr)})}
function cancel(){editIndex=null;$('entryTitle').textContent='记录一次出手';$('add').textContent='添加出手';$('cancel').hidden=true;$('note').value='';$('replay').checked=false}
function draw(){const row=frame();$('boxes').replaceChildren();for(const b of [...row.boxes,...(draft?[draft]:[])]){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');const c=b.xyxy;r.setAttribute('x',c[0]*1000);r.setAttribute('y',c[1]*1000);r.setAttribute('width',(c[2]-c[0])*1000);r.setAttribute('height',(c[3]-c[1])*1000);r.setAttribute('fill','none');r.setAttribute('stroke',b.kind==='ball'?'#42ff88':'#ff963f');r.setAttribute('stroke-width','3');r.setAttribute('vector-effect','non-scaling-stroke');$('boxes').append(r)}
 document.querySelectorAll('[data-vis]').forEach(b=>b.classList.toggle('active',b.dataset.vis===row.visibility));$('frameState').textContent=({pending:'尚未核对',visible:'球可见',not_visible:'看不到球',unclear:'看不清'}[row.visibility])+` · ${row.boxes.length}个框`}
function showFrame(){draft=null;start=null;$('frameImage').src=`/image/${item.id}/${item.images[frameIndex]}`;$('frameCount').textContent=`${frameIndex+1} / ${item.images.length} · ${item.images[frameIndex].replace('frame_','').replace('.jpg','')}秒`;$('prevFrame').disabled=frameIndex===0;$('nextFrame').disabled=frameIndex===item.images.length-1;draw()}
function tab(ball){$('shotSection').hidden=ball;$('ballSection').hidden=!ball;$('shotTab').classList.toggle('active',!ball);$('ballTab').classList.toggle('active',ball);if(ball){$('video').pause();showFrame()}}
async function load(id){if(dirty&&!await save()){return false}item=items.find(i=>i.id===id);data=await request(`/annotations/${id}`);const pending=localStorage.getItem(key());if(pending){data=JSON.parse(pending);dirty=true;status('已恢复本机草稿，请保存')}else{dirty=false;status('已载入项目记录')}frameIndex=0;cancel();$('shotsComplete').checked=!!data.shots_complete;$('framesComplete').checked=!!data.frames_complete;$('range').textContent='原片 00:30–01:30 · 60秒';$('video').src=`/video/${id}`;$('release').value=item.start_s;renderShots();tab(false);return true}
async function save(){if(!data||saving)return false;saving=true;$('save').disabled=true;status('正在保存');const payload=JSON.stringify(data);try{await request(`/annotations/${item.id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:payload});if(JSON.stringify(data)===payload){dirty=false;localStorage.removeItem(key());status('已保存到项目')}else{status('还有新改动，请再保存')}return true}catch(e){status(e.message,true);return false}finally{saving=false;$('save').disabled=false}}
$('save').onclick=save;$('shotTab').onclick=()=>tab(false);$('ballTab').onclick=()=>tab(true);$('match').onchange=async()=>{const previous=item.id;try{if(!await load($('match').value))$('match').value=previous}catch(e){status(e.message,true)}};
$('video').onloadedmetadata=()=>{$('video').currentTime=item.start_s};$('video').ontimeupdate=()=>{$('clock').textContent=mm($('video').currentTime);if($('video').currentTime>=item.end_s){$('video').pause()}};$('video').onerror=()=>status('视频加载失败，请刷新后重试',true);
$('back').onclick=()=>{$('video').currentTime=Math.max(item.start_s,$('video').currentTime-1)};$('forward').onclick=()=>{$('video').currentTime=Math.min(item.end_s-.01,$('video').currentTime+1)};$('play').onclick=()=>{$('video').paused?$('video').play():$('video').pause()};$('speed').onchange=()=>{$('video').playbackRate=Number($('speed').value)};$('capture').onclick=()=>{$('release').value=$('video').currentTime.toFixed(2)};$('cancel').onclick=cancel;
$('add').onclick=()=>{const t=Number($('release').value);if(!Number.isFinite(t)||t<item.start_s||t>=item.end_s){status('请填写30秒到90秒之间的离手时间',true);return}const shot={release_s:t,result:$('result').value,value:$('value').value?Number($('value').value):null,is_replay:$('replay').checked,note:$('note').value};if(editIndex===null)data.shots.push(shot);else data.shots[editIndex]=shot;data.shots.sort((a,b)=>a.release_s-b.release_s);cancel();changed();renderShots()};
$('shotsComplete').onchange=()=>{data.shots_complete=$('shotsComplete').checked;changed()};$('framesComplete').onchange=()=>{data.frames_complete=$('framesComplete').checked;changed()};$('prevFrame').onclick=()=>{frameIndex--;showFrame()};$('nextFrame').onclick=()=>{frameIndex++;showFrame()};$('seeFrame').onclick=()=>{tab(false);$('video').currentTime=Number(item.images[frameIndex].replace('frame_','').replace('.jpg',''))};
document.querySelectorAll('[data-vis]').forEach(b=>b.onclick=()=>{const f=frame();if(b.dataset.vis!=='visible')f.boxes=f.boxes.filter(x=>x.kind!=='ball');f.visibility=b.dataset.vis;changed();draw()});$('undo').onclick=()=>{const f=frame();f.boxes.pop();if(f.visibility==='visible'&&!f.boxes.some(b=>b.kind==='ball'))f.visibility='pending';changed();draw()};$('clear').onclick=()=>{frame().boxes=[];frame().visibility='pending';changed();draw()};
function point(e){const r=$('boxes').getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
$('boxes').onpointerdown=e=>{start=point(e);$('boxes').setPointerCapture(e.pointerId)};$('boxes').onpointermove=e=>{if(!start)return;const end=point(e);draft={kind:$('boxKind').value,xyxy:[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])]};draw()};$('boxes').onpointerup=()=>{if(draft&&draft.xyxy[2]-draft.xyxy[0]>.002&&draft.xyxy[3]-draft.xyxy[1]>.002){frame().boxes.push(draft);if(draft.kind==='ball')frame().visibility='visible';changed()}start=null;draft=null;draw()};$('boxes').onpointercancel=()=>{start=null;draft=null;draw()};
window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue='还有未保存的标注'}};
(async()=>{try{items=await request('/manifest');const titles=['NBA总决赛','西班牙ACB','WNBA','NCAA'];items.forEach((r,i)=>{const o=document.createElement('option');o.value=r.id;o.textContent=`第${i+1}段 · ${titles[i]||r.id}`;$('match').append(o)});if(!items.length)throw Error('没有标注任务');await load(items[0].id)}catch(e){status(e.message,true)}})();
</script></html>
