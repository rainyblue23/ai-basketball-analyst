<!doctype html><meta charset="utf-8"><title>战术图离线对照</title><style>body{font:16px system-ui;background:#101822;color:#eee;margin:20px}button,select{font:inherit;padding:8px}#stage{position:relative;width:min(54vw,550px);height:75vh}#base,#overlay{position:absolute;inset:0}svg{height:100%;width:100%}#time{width:65vw}p{max-width:850px;color:#b9c8da}</style><h2>战术图离线对照</h2><p>蓝色主队 · 橙色客队。A/B/T是临时轨迹编号，不是球衣号码。位置与角色仍待审核；视频切镜、缺坐标处不强行接轨迹。</p><select id="variant"><option value="observed">有证据边界的轨迹</option><option value="original">原结果</option></select><button id="play">播放 / 暂停</button><span id="label"></span><input id="time" type="range" min="0" max="90.958" step="0.033" value="0"><div id="status"></div><div id="stage"><div id="base"></div><div id="overlay"></div></div><script src="data.js"></script><script src="court.js"></script><script src="tactics.js"></script><script>
let rows=[],identities=[],playing=false,t=0,last=0,duration=0;const get=id=>document.getElementById(id);get('base').innerHTML=Court.courtSVG({view:'full'});
async function load(){const meta=await(await fetch('meta.json')).json();if(meta.variants&&!get('variant').dataset.configured){get('variant').innerHTML=meta.variants.map(v=>'<option value="'+v+'">'+((meta.variant_labels||{})[v]||{observed:'原轨迹证据边界',roles:'仅裁判过滤',teams:'仅多帧分队',combined:'裁判过滤 + 多帧分队'}[v]||v)+'</option>').join('');get('variant').value=meta.default_variant||(meta.variants.includes('combined')?'combined':meta.variants[0]);get('variant').dataset.configured='1'}if(meta.anonymous_team_groups)document.querySelector('p').textContent='蓝色分组A · 橙色分组B · 灰色分队未知。颜色分组尚未核实主客身份；T编号不是球衣号码。未知人员保留位置，不参与球队阵型统计。';duration=meta.duration;get('time').max=duration;rows=await(await fetch(get('variant').value+'.json',{cache:'no-store'})).json();identities=await(await fetch('players.json')).json();draw()}
function draw(){let i=0;while(i+1<rows.length&&rows[i+1].t<=t)i++;const f=interpolateTacticsFrame(rows[i],rows[i+1],t);get('overlay').innerHTML=f?Court.tacticsPlayersLayer(f,{}, {view:'full',players:identities}):'';get('label').textContent=t.toFixed(2)+'秒';const unknown=(f?.players||[]).filter(p=>p[1]==='unknown').length;get('status').textContent=f?.population_quality?.valid===false?'本时刻人数或分队仍异常，待核实；未截取前五人':!f?.players?.length?'本时刻位置缺失':'显示'+f.players.length+'条球员轨迹'+(unknown?'，其中'+unknown+'人分队未知':'');get('time').value=t}
get('variant').onchange=load;get('time').oninput=()=>{t=Number(get('time').value);draw()};get('play').onclick=()=>{playing=!playing;last=0};function tick(now){if(playing){if(last)t=Math.min(duration,t+(now-last)/1000);draw();if(t>=duration)playing=false}last=now;requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script>
